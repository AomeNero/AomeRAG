[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aome-rag"
version = "0.1.0"
description = "Agentic RAG backend for a company private-domain knowledge base"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "httpx>=0.27",
  "anyio>=4.3",
  "aiosqlite>=0.20",
  "python-multipart>=0.0.9",
  "Pillow>=10",
  "requests>=2.31",
]

# Heavy / platform-specific deps are optional so early phases install fast.
# Full backend install:  uv pip install -e ".[dev,vec,ingest]"
[project.optional-dependencies]
vec = ["zvec>=0.6"]            # in-process vector DB (Phase 4+)
ingest = ["markitdown"]        # office-doc parsing (Phase 5+)
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[project.scripts]
aomerag = "aome_rag.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aome_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = ["-m", "not live"]
testpaths = ["tests"]
markers = [
  "integration: needs local Zvec/sqlite (no network)",
  "live: needs real DeepSeek/Ollama (network)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
